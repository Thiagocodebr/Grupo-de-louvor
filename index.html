<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Louvor Santa Esmeralda</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        /* Estilos do Editor e Toolbar */
        .toolbar { background: #222; padding: 10px; border: 1px solid #444; border-bottom: none; display: flex; gap: 8px; flex-wrap: wrap; border-radius: 8px 8px 0 0; align-items: center; }
        .toolbar select, .toolbar button, .toolbar input { background: #333; color: white; border: 1px solid #555; border-radius: 4px; padding: 4px 8px; cursor: pointer; height: 32px; }
        .toolbar button:hover { background: #444; }
        
        .editor-rich { min-height: 450px; background: #1a1a1a; color: white; padding: 20px; border: 1px solid #444; border-radius: 0 0 8px 8px; outline: none; overflow-y: auto; line-height: 1.6; font-family: 'Arial', sans-serif; }
        
        /* Containers e Boxes */
        .btn-container { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 15px; }
        .agenda-box { background: rgba(0, 209, 178, 0.1); border: 1px solid #00d1b2; border-radius: 8px; padding: 15px; margin-bottom: 20px; text-align: center; }
        .aviso-box { background: rgba(241, 196, 15, 0.1); border: 2px solid #f1c40f; border-radius: 8px; padding: 15px; margin-bottom: 25px; }
        .pix-box { background: linear-gradient(145deg, rgba(255, 77, 148, 0.1), rgba(255, 77, 148, 0.05)); border: 1px solid #ff4d94; border-radius: 12px; padding: 20px; margin-bottom: 25px; text-align: center; }
        
        /* Progress Bar Vaquinha */
        .progress-bar-bg { background: #333; height: 12px; border-radius: 6px; margin: 15px 0 5px 0; overflow: hidden; cursor: pointer; border: 1px solid rgba(255, 77, 148, 0.3); }
        .progress-bar-fill { background: #ff4d94; height: 100%; width: 0%; transition: width 0.8s ease; box-shadow: 0 0 10px rgba(255, 77, 148, 0.5); }
        
        /* Filtros de Categoria */
        .btn-tag { background: #333; border: 1px solid #444; color: #ddd; padding: 4px 12px; border-radius: 15px; cursor: pointer; font-size: 0.75rem; transition: 0.3s; }
        .btn-tag:hover { background: #00d1b2; color: black; border-color: #00d1b2; }
    </style>
</head>
<body>
    <audio id="audio-hover" src="audios/click-buttons-ui-menu-sounds-effects-button-14-205402.mp3" preload="auto"></audio>

    <header class="cabecalho">
        <div class="user-bar" style="display: flex; justify-content: flex-end; align-items: center; gap: 15px; padding: 10px; background: rgba(0,0,0,0.2);">
            <span id="boas-vindas" style="color: #00d1b2; font-weight: bold; font-size: 0.9rem;"></span>
            <button onclick="sair()" style="background: #ff4d4d; color: white; border: none; padding: 6px 12px; border-radius: 5px; cursor: pointer; font-weight: bold;">Sair 🚪</button>
        </div>
        <h1 class="titulo-principal">🎶 Grupo de Louvor Santa Esmeralda</h1>
        <nav class="navegacao">
            <a href="#editor-letras" class="nav-link">Letras</a>
            <a href="#repertorio" class="nav-link">Repertório</a>
            <a href="#comunidade" class="nav-link">Comunidade</a>
        </nav>
    </header>

    <main class="conteudo-principal">
        <section id="repertorio" class="painel">
            <h2>✨ Repertório</h2>
            <div style="display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap;">
                <button onclick="filtrarCategoria('Adoração')" class="btn-tag">Adoração</button>
                <button onclick="filtrarCategoria('Santa Ceia')" class="btn-tag">Santa Ceia</button>
                <button onclick="filtrarCategoria('Celebração')" class="btn-tag">Celebração</button>
                <button onclick="carregarMusicas()" class="btn-tag" style="background: #444;">Todas</button>
            </div>
            
            <div style="padding: 5px; font-size: 0.8rem; color: #888;">Músicas no Banco: <span id="contador-musicas" style="color: #00d1b2; font-weight: bold;">0</span></div>
            <div style="padding: 5px;"><input type="text" id="input-pesquisa" placeholder="🔍 Pesquisar música..." style="width: 100%; padding: 10px; border-radius: 8px; background: #1a1a1a; color: white; border: 1px solid #333;"></div>
            <div id="lista-musicas" class="lista-itens" style="max-height: 400px; overflow-y: auto; margin-top: 10px;">Carregando...</div>
        </section>

        <section id="editor-letras" class="painel">
            <h2>✍️ Editor de Letras</h2>
            
            <div style="display: flex; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; align-items: center;">
                <select id="select-categoria" style="flex: 1; min-width: 120px;">
                    <option value="Adoração">Adoração</option>
                    <option value="Santa Ceia">Santa Ceia</option>
                    <option value="Celebração">Celebração</option>
                </select>
                <input type="text" id="tom-musica" placeholder="Tom" style="flex: 0.3; min-width: 60px; text-align: center; color: #f1c40f; font-weight: bold; background: #222; border: 1px solid #444; border-radius: 5px; padding: 8px;">
                <input type="text" id="link-midia" placeholder="Link YouTube ou Spotify" style="flex: 2; min-width: 200px; background: #222; border: 1px solid #444; color: white; border-radius: 5px; padding: 8px;">
            </div>

            <div class="toolbar">
                <button type="button" onclick="execCmd('bold')" title="Negrito"><b>B</b></button>
                <button type="button" onclick="execCmd('italic')" title="Itálico"><i>I</i></button>
                <button type="button" onclick="execCmd('underline')" title="Sublinhado"><u>U</u></button>
                
                <select onchange="execCmd('fontName', this.value)" title="Tipo de Letra">
                    <option value="Arial">Arial</option>
                    <option value="Courier New">Cifrada (Mono)</option>
                    <option value="Verdana">Verdana</option>
                    <option value="Georgia">Georgia</option>
                </select>

                <select onchange="execCmd('fontSize', this.value)" title="Tamanho">
                    <option value="3">Normal</option>
                    <option value="1">Mínima</option>
                    <option value="2">Pequena</option>
                    <option value="4">Média</option>
                    <option value="5">Grande</option>
                    <option value="6">Extra Grande</option>
                    <option value="7">Máxima</option>
                </select>

                <input type="color" oninput="execCmd('foreColor', this.value)" title="Cor da Letra">
                
                <button type="button" class="emoji-btn-toggle" onclick="toggleEmojiPicker('picker-editor')">😀</button>
                <div id="picker-editor" class="emoji-picker"></div>
            </div>

            <div id="texto-letra" class="editor-rich" contenteditable="true"></div>

            <div class="btn-container">
                <button id="btn-salvar-letra" class="btn-acao">Salvar Tudo</button>
                <button id="btn-gerar-pdf" class="btn-acao" style="background: #e67e22;">Gerar PDF</button>
                <button onclick="gerarLivretoCompleto()" class="btn-acao" style="background: #27ae60;">Gerar Livreto (Todas)</button>
                <button onclick="document.getElementById('texto-letra').innerHTML=''; document.getElementById('link-midia').value=''" class="btn-acao" style="background: #7f8c8d;">Limpar</button>
            </div>
        </section>

        <section id="comunidade" class="painel">
            <div class="pix-box">
                <h2 style="color: #ff4d94; margin-bottom: 15px;">💖 Vaquinha</h2>
                <div style="background: white; padding: 10px; display: inline-block; border-radius: 10px; margin-bottom: 15px;">
                    <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=SEU_EMAIL_PIX_AQUI" alt="QR Code Pix" style="width: 110px; height: 110px;">
                </div>
                <div style="text-align: left; background: rgba(0,0,0,0.3); padding: 10px; border-radius: 8px; border: 1px solid rgba(255, 77, 148, 0.2); margin-bottom: 15px;">
                    <small style="color: #ff4d94; font-weight: bold; font-size: 0.65rem; text-transform: uppercase;">Chave Pix:</small>
                    <div style="display: flex; align-items: center; justify-content: space-between;">
                        <span id="chave-pix-texto" style="font-size: 0.85rem; color: #fff;">seu-email@exemplo.com</span>
                        <button onclick="copiarPix()" style="background: #ff4d94; border: none; padding: 4px 8px; border-radius: 4px; font-size: 0.7rem;">Copiar</button>
                    </div>
                </div>
                <div class="progress-bar-bg" onclick="definirValorVaquinha()">
                    <div class="progress-bar-fill"></div>
                </div>
                <div style="display: flex; justify-content: space-between; font-size: 0.75rem; color: #ff4d94; font-weight: bold;">
                    <span>Meta: R$ 200</span>
                    <span id="porcentagem-label">0%</span>
                </div>
            </div>

            <div class="aviso-box">
                <h2>📌 Quadro de Avisos</h2>
                <div id="quadro-avisos-display" style="padding: 10px 0;">Carregando...</div>
                <button onclick="editarQuadroAvisos()" class="btn-acao" style="width: 100%; background: #f1c40f; color: #000; font-weight: bold;">EDITAR AVISO</button>
            </div>

            <div class="agenda-box">
                <h3>📅 Próximo Ensaio</h3>
                <p id="data-ensaio-display" style="font-weight: bold; margin: 5px 0; color: #00d1b2; font-size: 1.1rem;">Não definido</p>
                <div id="countdown-container" style="display: none;">
                    <div id="countdown-timer" style="color: #f1c40f; font-size: 1.5rem; font-weight: bold; font-family: monospace;"></div>
                </div>
                <button onclick="definirNovoEnsaio()" class="btn-acao" style="background: none; border: 1px dashed #00d1b2; color: #00d1b2; padding: 5px 15px; width: auto; margin-top: 10px;">Mudar Data</button>
            </div>

            <h2>💬 Chat</h2>
            <div id="chat-mensagens" style="height: 200px; overflow-y: auto; background: #1a1a1a; padding: 10px; border-radius: 8px; margin-bottom: 10px; border: 1px solid #333;"></div>
            <div style="display: flex; gap: 8px;">
                <input type="text" id="chat-input" placeholder="Conversar..." style="flex-grow: 1; padding: 10px; background: #1a1a1a; color: white; border: 1px solid #333; border-radius: 8px;">
                <button onclick="enviarChat()" class="btn-acao">Enviar</button>
            </div>

            <hr style="margin: 30px 0; border: 0; border-top: 1px solid #333;">
            <h2>💡 Mural de Ideias</h2>
            <div id="mural-ideias-display" style="max-height: 200px; overflow-y: auto; margin-bottom: 10px;"></div>
            <button onclick="adicionarNovaIdeia()" class="btn-acao" style="width: 100%; background: #f1c40f; color: #000; font-weight: bold;">Sugerir Nova Ideia</button>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
